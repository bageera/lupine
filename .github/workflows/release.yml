name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - name: build + verify
        run: |
          cargo build --locked --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/lupine.wasm web/
          node scripts/e2e.mjs
          node scripts/e2e-formats.mjs
      - name: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/lupine-$VERSION
          cp web/demux.js web/worklet.js web/player.js web/index.html web/lupine.wasm dist/lupine-$VERSION/
          tar -czf lupine-$VERSION.tar.gz -C dist lupine-$VERSION
      - uses: softprops/action-gh-release@v2
        with:
          files: lupine-*.tar.gz
          generate_release_notes: true